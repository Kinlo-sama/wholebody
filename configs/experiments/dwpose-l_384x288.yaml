_base_:
- ../runtime/nvidia.yaml
experiment_name: dwpose-l_384x288
model:
  type: TopDownPoseEstimator
  pretrained: null
  test_cfg:
    flip_test: true
    shift_heatmap: true
  backbone:
    type: CSPNeXt
    arch: P5
    expand_ratio: 0.5
    deepen_factor: 1.0
    widen_factor: 1.0
    out_indices:
    - 4
    channel_attention: true
  neck: null
  head:
    type: RTMCCHead
    in_channels: 1024
    out_channels: 133
    input_size: &id001
    - 384
    - 288
    in_featuremap_size:
    - 12
    - 9
    simcc_split_ratio: 2.0
    final_layer_kernel_size: 7
    gau_cfg:
      hidden_dims: 256
      s: 128
      expansion_factor: 2
      dropout_rate: 0.0
      drop_path: 0.0
      act_fn: SiLU
      use_rel_bias: false
      pos_enc: false
    codec:
      type: SimCCLabel
      input_size: *id001
      sigma:
      - 6.0
      - 6.93
      simcc_split_ratio: 2.0
      normalize: false
data:
  val:
    dataset:
      type: COCOWholeBodyDataset
      ann_file: data/coco/annotations/coco_wholebody_val_v1.0.json
      img_prefix: data/coco/val2017/
      keypoint_spec: coco_wholebody_133
      test_mode: true
      bbox_file: data/coco/person_detection_results/COCO_val2017_detections_AP_H_56_person.json
      pipeline:
      - type: LoadImageFromFile
      - type: TopDownAffine
        input_size: *id001
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: PackPoseInputs
    dataloader:
      batch_size: 32
      num_workers: 0
      shuffle: false
evaluation:
  metrics:
  - type: CocoWholeBodyMetric
    ann_file: data/coco/annotations/coco_wholebody_val_v1.0.json
