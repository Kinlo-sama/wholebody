runtime:
  device: "auto"
  precision: "fp16"

training:
  work_dir: "work_dirs/dwpose_dummy"
  epochs: 5
  val_interval: 1

data:
  train:
    dataset:
      type: "DummyPoseDataset"
      length: 128
      image_size: [256, 192]
      num_keypoints: 133
    dataloader:
      batch_size: 16
      shuffle: True
      num_workers: 0

optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.05

scheduler:
  type: "CosineAnnealingLR"
  T_max: 5
  eta_min: 0.00001

model:
  type: "PoseEstimatorDistiller"
  student:
    type: "TopDownPoseEstimator"
    backbone:
      type: "CSPNeXt"
      arch: "P5"
      expand_ratio: 0.5
      deepen_factor: 0.33
      widen_factor: 0.5
      out_indices: [4]
      channel_attention: True
    head:
      type: "RTMCCHead"
      in_channels: 512
      out_channels: 133
      input_size: [256, 192]
      in_featuremap_size: [8, 6]
      simcc_split_ratio: 2.0
      final_layer_kernel_size: 7
      gau_cfg:
        hidden_dims: 256
        s: 128
        expansion_factor: 2
        dropout_rate: 0.0
        drop_path: 0.0
        act_fn: "SiLU"
        use_rel_bias: False
        pos_enc: False
      codec:
        type: "SimCCLabel"
        input_size: [256, 192]
        sigma: [4.9, 5.66]
        simcc_split_ratio: 2.0
        normalize: False
  teacher:
    type: "TopDownPoseEstimator"
    backbone:
      type: "CSPNeXt"
      arch: "P5"
      expand_ratio: 0.5
      deepen_factor: 1.0
      widen_factor: 1.0
      out_indices: [4]
      channel_attention: True
    head:
      type: "RTMCCHead"
      in_channels: 1024
      out_channels: 133
      input_size: [256, 192]
      in_featuremap_size: [8, 6]
      simcc_split_ratio: 2.0
      final_layer_kernel_size: 7
      gau_cfg:
        hidden_dims: 256
        s: 128
        expansion_factor: 2
        dropout_rate: 0.0
        drop_path: 0.0
        act_fn: "SiLU"
        use_rel_bias: False
        pos_enc: False
      codec:
        type: "SimCCLabel"
        input_size: [256, 192]
        sigma: [4.9, 5.66]
        simcc_split_ratio: 2.0
        normalize: False
  distill_cfg:
    - methods:
        - type: "KDLoss"
          weight: 1.0
    - methods:
        - type: "FeaLoss"
          student_channels: 512
          teacher_channels: 1024
          alpha_fea: 0.00007
