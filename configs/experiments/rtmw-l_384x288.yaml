_base_:
  - ../runtime/apple_silicon.yaml

model:
  type: TopDownPoseEstimator
  
  backbone:
    type: CSPNeXt
    arch: P5
    expand_ratio: 0.5
    deepen_factor: 1.0
    widen_factor: 1.0
    channel_attention: true
    out_indices: [2, 3, 4]
    
  neck:
    type: CSPNeXtPAFPN
    in_channels: [256, 512, 1024]
    out_channels: null
    out_indices: [1, 2]
    num_csp_blocks: 2
    expand_ratio: 0.5
    
  head:
    type: RTMWHead
    in_channels: 1024
    out_channels: 133
    input_size: [384, 288]
    in_featuremap_size: [12, 9]
    simcc_split_ratio: 2.0
    final_layer_kernel_size: 1
    gau_cfg:
      hidden_dims: 256
      s: 128
      expansion_factor: 2
      dropout_rate: 0.0
      drop_path: 0.0
      act_fn: SiLU
      use_rel_bias: false
      pos_enc: false
    codec:
      type: SimCCLabel
      input_size: [384, 288]
      sigma: 6.0
      simcc_split_ratio: 2.0
      normalize: false
      
  test_cfg:
    flip_test: true

data:
  val:
    dataset:
      type: CocoWholeBodyDataset
      ann_file: data/coco/annotations/coco_wholebody_val_v1.0.json
      img_prefix: data/coco/val2017/
      pipeline:
        - type: LoadImage
        - type: GetBBoxCenterScale
          padding: 1.25
        - type: TopDownAffine
          input_size: [384, 288]
        - type: Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - type: PackPoseInputs
      test_mode: true
      bbox_file: data/coco/person_detection_results/COCO_val2017_detections_AP_H_56_person.json
    dataloader:
      batch_size: 32
      num_workers: 4

evaluation:
  metrics:
    - type: CocoWholeBodyMetric
      ann_file: data/coco/annotations/coco_wholebody_val_v1.0.json
