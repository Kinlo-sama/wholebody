_base_:
  - ../runtime/apple_silicon.yaml

experiment_name: rtmw-m_256x192

training:
  epochs: 270
  val_interval: 10
  optimizer:
    type: AdamW
    lr: 0.004
    weight_decay: 0.05

model:
  type: TopDownPoseEstimator
  pretrained: "weights/rtmw-m_fixed.pth"
  test_cfg:
    flip_test: false
    shift_heatmap: false
  backbone:
    type: CSPNeXt
    arch: P5
    expand_ratio: 0.5
    deepen_factor: 0.67
    widen_factor: 0.75
    channel_attention: true
    out_indices: [2, 3, 4]
  neck:
    type: CSPNeXtPAFPN
    in_channels: [192, 384, 768]
    out_channels: null
    out_indices: [1, 2]
    num_csp_blocks: 2
    expand_ratio: 0.5
  head:
    type: RTMWHead
    in_channels: 768
    out_channels: 133
    input_size: [256, 192] # [H, W]
    in_featuremap_size: [8, 6] # [H/32, W/32]
    simcc_split_ratio: 2.0
    final_layer_kernel_size: 7
    gau_cfg:
      hidden_dims: 256
      s: 128
      expansion_factor: 2
      dropout_rate: 0.
      drop_path: 0.
      act_fn: SiLU
      use_rel_bias: false
      pos_enc: false
    codec:
      type: SimCCLabel
      input_size: [256, 192]
      sigma: 6.0
      simcc_split_ratio: 2.0
      normalize: false

data:
  val:
    dataset:
      type: COCOWholeBodyDataset
      ann_file: data/coco/annotations/coco_wholebody_val_v1.0.json
      img_prefix: data/coco/val2017/
      keypoint_spec: coco_wholebody_133
      test_mode: true
      bbox_file: data/coco/person_detection_results/COCO_val2017_detections_AP_H_56_person.json
      pipeline:
        - type: LoadImageFromFile
        - type: TopDownAffine
          input_size: [256, 192]
        - type: Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - type: PackPoseInputs
    dataloader:
      batch_size: 32
      num_workers: 0
      shuffle: false

evaluation:
  metrics:
    - type: CocoWholeBodyMetric
      ann_file: data/coco/annotations/coco_wholebody_val_v1.0.json
