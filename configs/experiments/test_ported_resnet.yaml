_base_:
  - ../runtime/apple_silicon.yaml

dataset_info:
  keypoint_spec: coco_wholebody_133

model:
  type: TopDownPoseEstimator
  backbone:
    type: ResNet
    depth: 50
  neck:
    type: IdentityNeck
  head:
    type: HeatmapHead
    in_channels: 2048
    num_keypoints: 133
    deconv_out_channels: [256, 256, 256]
